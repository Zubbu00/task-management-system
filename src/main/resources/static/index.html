<!DOCTYPE html>
<html>
<head>
    <title>Task Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        input {
            padding: 8px;
            width: 250px;
        }
        button {
            padding: 8px;
            margin-left: 5px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: white;
            margin: 5px 0;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

<h1>📝 Task Management</h1>

<input type="text" id="taskInput" placeholder="Enter new task">
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

<script src="script.js"></script>

</body>
</html>
